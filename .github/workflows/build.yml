name: Build mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12.1"

      - name: Build
        run: gradle build --no-daemon

      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: voicevanish-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      - name: Publish jar as a GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/voicevanish-*.jar | grep -v sources | head -n 1)
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" "$JAR" --title "Voice Vanish build ${{ github.run_number }}" --notes "Put this jar in your server's mods folder." --latest
